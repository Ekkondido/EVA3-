server {
    listen 80;
    server_name localhost;

    # 1. Sirve la página web de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Redirige a Ventas apuntando a la ruta explícita 🚀
    location /api/v1/ventas {
        proxy_pass http://backend-venta-svc:8080/api/v1/ventas; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Redirige a Despachos apuntando a la ruta explícita 🚀
    location /api/v1/despachos {
        proxy_pass http://backend-despacho-svc:8080/api/v1/despachos; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
